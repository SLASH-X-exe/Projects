<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charSet="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>نظام إدارة المحاماة</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<style>
body {
  background: #f8f9fa;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}
.login-wrapper {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
}
.login-card {
  width: 420px;
  max-width: 90vw;
  padding: 2rem;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  background: #fff;
}
.logo-circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 0.5rem;
  background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
}
.form-control {
  font-size: 16px;
}
.btn-primary {
  background: #2c5282;
  border-color: #2c5282;
}
.btn-primary:hover {
  background: #1e3a5f;
  border-color: #1e3a5f;
}
@media (max-width: 576px) {
  .login-card {
    padding: 1.25rem;
  }
  .login-card h4 {
    font-size: 1.1rem;
  }
}
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="logo-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="white" viewBox="0 0 512 512">
          <path d="M448 64H320c-17.7 0-32 14.3-32 32s14.3 32 32 32h64v96H256V96h64c17.7 0 32-14.3 32-32s-14.3-32-32-32H128c-17.7 0-32 14.3-32 32s14.3 32 32 32h64v128H64v-96h64c17.7 0 32-14.3 32-32s-14.3-32-32-32H0v64c0 70.7 57.3 128 128 128h32v160H96c-17.7 0-32 14.3-32 32s14.3 32 32 32h320c17.7 0 32-14.3 32-32s-14.3-32-32-32H352V256h32c70.7 0 128-57.3 128-128V64z"/>
        </svg>
      </div>
      <h4 class="fw-bold mb-0">مكتب المحاماة</h4>
      <p class="text-muted small">نظام إدارة المكتب القانوني</p>
    </div>
    <form id="loginForm">
      <div class="mb-3">
        <label for="loginEmail" class="form-label">البريد الإلكتروني</label>
        <input id="loginEmail" type="email" class="form-control" required autocomplete="email"/>
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label">كلمة المرور</label>
        <input id="loginPassword" type="password" class="form-control" required autocomplete="current-password"/>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input id="rememberMe" class="form-check-input" type="checkbox"/>
          <label class="form-check-label" for="rememberMe">تذكرني</label>
        </div>
      </div>
      <button id="loginSubmitBtn" type="submit" class="btn btn-primary w-100">دخول</button>
    </form>
  </div>
</div>
</body>
</html>
