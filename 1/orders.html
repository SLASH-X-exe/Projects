<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS - Orders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #fcf9f8; --bg-alt: #f0edec; --text: #1c1b1b;
            --text-muted: #737874; --accent: #172820;
            --accent-hover: #2c3e35; --border: #e2ddd9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.5;
        }
        header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .header-inner {
            max-width: 1280px; margin: 0 auto; padding: 1rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
        }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); text-decoration: none; }
        nav.main-nav { display: flex; align-items: center; gap: 1.5rem; }
        nav.main-nav a {
            font-size: 0.875rem; font-weight: 500; color: var(--text-muted);
            text-decoration: none; transition: color 0.2s;
        }
        nav.main-nav a:hover, nav.main-nav a.active { color: var(--text); }
        .login-btn {
            background: var(--accent); color: #fff; padding: 0.5rem 1rem;
            border-radius: 999px; font-size: 0.875rem; font-weight: 500;
            text-decoration: none;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 4rem 1.5rem; }
        h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 2.5rem; }
        .empty-orders {
            background: #fff; border: 1px solid var(--border);
            border-radius: 1.5rem; padding: 3rem; text-align: center;
        }
        .empty-orders h2 { font-size: 1.5rem; margin-bottom: 1rem; }
        .empty-orders p { color: var(--text-muted); margin-bottom: 2rem; }
        .btn-primary {
            display: inline-block; background: var(--accent); color: #fff;
            padding: 0.75rem 2rem; border-radius: 999px; text-decoration: none;
            font-weight: 600;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .order-card {
            background: #fff; border: 1px solid var(--border);
            border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem;
        }
        .order-header {
            display: flex; justify-content: space-between;
            padding-bottom: 1rem; border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .order-id { font-weight: 600; }
        .order-date { color: var(--text-muted); font-size: 0.875rem; }
        .order-items { display: flex; flex-direction: column; gap: 0.75rem; }
        .order-item {
            display: flex; justify-content: space-between;
            font-size: 0.875rem; color: var(--text-muted);
        }
        .order-total {
            display: flex; justify-content: space-between;
            padding-top: 1rem; border-top: 1px solid var(--border);
            margin-top: 1rem; font-weight: 700; font-size: 1.125rem;
        }
        .clear-all-btn {
            background: transparent; color: #e74c3c; border: 1px solid #e74c3c;
            padding: 0.75rem 1.5rem; border-radius: 999px; cursor: pointer;
            margin-top: 2rem; font-size: 0.875rem;
        }
        .clear-all-btn:hover { background: #e74c3c; color: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">NEXUS</a>
            <nav class="main-nav">
                <a href="index.html">Shop</a>
                <a href="orders.html" class="active">Orders</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
            </nav>
            <a href="login.html" class="login-btn">Login</a>
        </div>
    </header>

    <div class="container">
        <h1>My Orders</h1>
        <p class="subtitle">View your order history</p>
        <div id="orders-content"></div>
    </div>

    <script>
        function getOrders() {
            return JSON.parse(localStorage.getItem('orders') || '[]');
        }

        function getCart() {
            return JSON.parse(localStorage.getItem('cart') || '[]');
        }

        function clearOrders() {
            if (confirm('Delete all order history?')) {
                localStorage.removeItem('orders');
                render();
            }
        }

        function render() {
            const cart = getCart();
            const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').textContent = cartCount;

            const orders = getOrders();
            const content = document.getElementById('orders-content');

            if (orders.length === 0) {
                content.innerHTML = `
                    <div class="empty-orders">
                        <h2>No orders yet</h2>
                        <p>You haven't placed any orders. Start shopping now!</p>
                        <a href="index.html" class="btn-primary">Start Shopping</a>
                    </div>
                `;
                return;
            }

            content.innerHTML = orders.slice().reverse().map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-id">Order #${order.id}</span>
                        <span class="order-date">${order.date}</span>
                    </div>
                    <div class="order-items">
                        ${order.items.map(item => `
                            <div class="order-item">
                                <span>${item.name} × ${item.qty}</span>
                                <span>$${item.price * item.qty}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="order-total">
                        <span>Total</span>
                        <span>$${order.total}</span>
                    </div>
                </div>
            `).join('') + `
                <button class="clear-all-btn" onclick="clearOrders()">Clear Order History</button>
            `;
        }

        render();
    </script>
</body>
</html>
