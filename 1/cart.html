<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS - Cart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #fcf9f8; --bg-alt: #f0edec; --text: #1c1b1b;
            --text-muted: #737874; --accent: #172820;
            --accent-hover: #2c3e35; --border: #e2ddd9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.5;
        }
        header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .header-inner {
            max-width: 1280px; margin: 0 auto; padding: 1rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
        }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); text-decoration: none; }
        nav.main-nav { display: flex; align-items: center; gap: 1.5rem; }
        nav.main-nav a {
            font-size: 0.875rem; font-weight: 500; color: var(--text-muted);
            text-decoration: none; transition: color 0.2s;
        }
        nav.main-nav a:hover, nav.main-nav a.active { color: var(--text); }
        .login-btn {
            background: var(--accent); color: #fff; padding: 0.5rem 1rem;
            border-radius: 999px; font-size: 0.875rem; font-weight: 500;
            text-decoration: none;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 4rem 1.5rem; }
        h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 2.5rem; }
        .empty-cart {
            background: #fff; border: 1px solid var(--border);
            border-radius: 1.5rem; padding: 3rem; text-align: center;
        }
        .empty-cart h2 { font-size: 1.5rem; margin-bottom: 1rem; }
        .empty-cart p { color: var(--text-muted); margin-bottom: 2rem; }
        .btn-primary {
            display: inline-block; background: var(--accent); color: #fff;
            padding: 0.75rem 2rem; border-radius: 999px; text-decoration: none;
            font-weight: 600; transition: background 0.2s;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .cart-item {
            background: #fff; border: 1px solid var(--border);
            border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem;
            display: flex; align-items: center; gap: 1.5rem;
        }
        .cart-item img { width: 100px; height: 120px; object-fit: cover; border-radius: 0.5rem; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem; }
        .cart-item-price { color: var(--text-muted); margin-bottom: 0.5rem; }
        .qty-controls { display: flex; align-items: center; gap: 0.75rem; }
        .qty-btn {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid var(--border); background: #fff;
            cursor: pointer; font-size: 1rem;
        }
        .qty-btn:hover { background: var(--bg-alt); }
        .remove-btn {
            background: transparent; border: 1px solid #e74c3c;
            color: #e74c3c; padding: 0.5rem 1rem; border-radius: 999px;
            cursor: pointer; font-size: 0.875rem;
        }
        .remove-btn:hover { background: #e74c3c; color: #fff; }
        .cart-summary {
            background: #fff; border: 1px solid var(--border);
            border-radius: 1rem; padding: 2rem; margin-top: 2rem;
        }
        .summary-row {
            display: flex; justify-content: space-between;
            font-size: 1.125rem; margin-bottom: 1.5rem;
        }
        .summary-row strong { font-weight: 700; }
        .checkout-btn {
            width: 100%; background: var(--accent); color: #fff;
            border: none; padding: 1rem; border-radius: 999px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .checkout-btn:hover { background: var(--accent-hover); }
        .clear-btn {
            width: 100%; background: transparent; color: #e74c3c;
            border: 1px solid #e74c3c; padding: 0.75rem; border-radius: 999px;
            font-size: 0.875rem; cursor: pointer; margin-top: 0.5rem;
        }
        .clear-btn:hover { background: #e74c3c; color: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">NEXUS</a>
            <nav class="main-nav">
                <a href="index.html">Shop</a>
                <a href="orders.html">Orders</a>
                <a href="cart.html" class="active">Cart (<span id="cart-count">0</span>)</a>
            </nav>
            <a href="login.html" class="login-btn">Login</a>
        </div>
    </header>

    <div class="container">
        <h1>Your Shopping Bag</h1>
        <p class="subtitle">Review your items before checkout</p>
        <div id="cart-content"></div>
    </div>

    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem('cart') || '[]');
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            render();
        }

        function updateCartCount() {
            const cart = getCart();
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').textContent = count;
        }

        function changeQty(id, delta) {
            const cart = getCart();
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                saveCart(cart.filter(i => i.id !== id));
            } else {
                saveCart(cart);
            }
        }

        function removeItem(id) {
            const cart = getCart().filter(i => i.id !== id);
            saveCart(cart);
        }

        function clearCart() {
            if (confirm('Are you sure you want to clear the cart?')) {
                localStorage.removeItem('cart');
                render();
            }
        }

        function render() {
            const cart = getCart();
            updateCartCount();
            const content = document.getElementById('cart-content');

            if (cart.length === 0) {
                content.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your cart is empty</h2>
                        <p>Add products to your cart and come back to complete checkout.</p>
                        <a href="index.html" class="btn-primary">Continue Shopping</a>
                    </div>
                `;
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            content.innerHTML = `
                ${cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.img}" alt="${item.name}" />
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">$${item.price} each</div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
                    </div>
                `).join('')}
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Total:</span>
                        <strong>$${total}</strong>
                    </div>
                    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
                    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
                </div>
            `;
        }

        function checkout() {
            const cart = getCart();
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const order = {
                id: Date.now(),
                date: new Date().toLocaleString(),
                items: cart,
                total: cart.reduce((sum, item) => sum + item.price * item.qty, 0)
            };
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));
            localStorage.removeItem('cart');
            alert('Order placed successfully!');
            window.location.href = 'orders.html';
        }

        render();
    </script>
</body>
</html>
