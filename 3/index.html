<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الاستغفار | Mohamed Yousry</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="apple-touch-icon.html" />
    <meta name="description" content="عداد الاستغفار اليومي من تطوير Mohamed Yousry" />
    <meta name="keywords" content="استغفار, ذكر, عداد, تسبيح, tasbeeh counter, istighfar counter" />
    <meta name="author" content="Mohamed Yousry" />
    <meta property="og:title" content="عداد الإستغفار" />
    <meta property="og:description" content="موقع يساعدك على الاستغفار اليومي وتتبع عدد مراتك." />
    <meta property="og:image" content="favicon.ico" />
    <meta name="twitter:card" content="summary" />
</head>

<body>
    <header>
        <h1>عداد الإستغفار</h1>
        <h3>كل استغفار بيمسح ذنب ويقربك من ربك</h3>
    </header>
    <main>
        <p id="ayah">
            {فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا}
        </p>
        <div id="counters">
            <p id="daily">0: عدد الإستغفارات اليوم</p>
            <p id="total">0: عدد الإستغفارات الكلي</p>
        </div>
        <div id="all-count">
            <p id="num">عدد الإستغفارات</p>
            <p id="count">0</p>
        </div>

        <div>
            <button id="tasbeeh">استغفر الله</button>
            <br />
            <button id="reset">إعادة العد (البدء من 0)</button>
        </div>
        <h3 id="message"></h3>
    </main>

    <footer>
        <h2>جزاك الله خيرًا على كل استغفار</h2>
        <h2>Programmed & Developed by : Mohamed Yousry</h2>
    </footer>
    <script src="script.js"></script>
</body>
</html>
