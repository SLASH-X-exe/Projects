<style>
:root{
  --bg:#F4F6FB;
  --surface:#FFFFFF;
  --ink:#0F2240;
  --muted:#66758F;
  --primary:#14386B;
  --primary-2:#1F5FA8;
  --soft:#E8EEF8;
  --accent:#F2A93B;
  --accent-dark:#D98C14;
  --accent-soft:#FDF1DC;
  --ok:#1FA37A;
  --ok-soft:#DDF4EC;
  --danger:#D9435A;
  --danger-soft:#FCE6EA;
  --info-soft:#E3EEFB;
  --border:#E1E7F1;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 6px 22px rgba(20,56,107,.08);
  --shadow-lg:0 16px 48px rgba(20,56,107,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;font-weight:800}
.num{font-family:'IBM Plex Sans Arabic',sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c9d4e8;border-radius:10px}
.hidden{display:none!important}
.i{vertical-align:-3px;flex-shrink:0}
h2 .i,h3 .i{vertical-align:-4px;margin-left:6px}
.chip,.mini-btn,.fab,.btn-gold,.btn-ghost,.btn-primary,.btn-accent,.btn-outline,.pay-opt,.footer-whatsapp{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-primary,.btn-accent,.btn-outline{display:flex}
.trust .ti{color:var(--primary-2)}
.empty-state .ic{display:flex;justify-content:center;color:#b3c1da}
.wa-float svg{display:block}
.close-x svg{display:block}
.vis{position:relative;display:block;width:100%;height:100%}
.vis svg,.vis img{position:absolute;inset:0;width:100%;height:100%;display:block}
.vis img{object-fit:contain;background:#fff;padding:4px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Cairo';font-weight:900;font-size:20px;color:var(--primary);white-space:nowrap}
.brand .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.brand .mark svg{width:22px;height:22px}
.search-wrap{flex:1;max-width:460px;position:relative}
.search-wrap input{width:100%;padding:12px 44px 12px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--bg);font-size:14px;outline:none;transition:.2s}
.search-wrap input:focus{border-color:var(--primary-2);background:#fff}
.search-wrap .ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
.top-actions{display:flex;align-items:center;gap:8px;margin-right:auto}
.icon-btn{position:relative;min-width:42px;height:42px;padding:0 12px;border-radius:12px;background:#fff;border:1.5px solid var(--border);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;color:var(--primary);transition:.2s}
.icon-btn:hover{border-color:var(--primary-2);background:var(--soft)}
.badge{position:absolute;top:-7px;left:-7px;background:var(--accent);color:#2b1c00;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 4px}
.admin-link{font-size:13px;color:var(--muted);padding:9px 12px;border-radius:999px}
.admin-link:hover{color:var(--primary)}
.hero{max-width:1200px;margin:22px auto 0;padding:0 20px}
.hero-card{background:linear-gradient(120deg,#0E2A52 0%,#14386B 55%,#1F5FA8 100%);border-radius:28px;padding:44px 40px;color:#fff;display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 12% 20%,rgba(242,169,59,.22),transparent 40%),radial-gradient(circle at 90% 90%,rgba(255,255,255,.12),transparent 45%)}
.hero-card>*{position:relative}
.hero h1{font-size:38px;line-height:1.35;margin-bottom:12px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{opacity:.88;font-size:16px;max-width:520px;margin-bottom:22px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.btn-gold{background:var(--accent);color:#2b1c00;padding:13px 24px;border-radius:12px;font-weight:800;font-size:15px;transition:.2s}
.btn-gold:hover{background:var(--accent-dark)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid rgba(255,255,255,.25)}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.hero-art{display:flex;justify-content:center}
.hero-art svg{width:100%;max-width:230px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.25))}
.trust{max-width:1200px;margin:18px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.trust div{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.trust b{display:block;color:var(--ink);font-size:14px;font-family:'Cairo'}
.trust .ti{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.section-head{max-width:1200px;margin:30px auto 0;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:22px;color:var(--primary)}
.sort-sel{padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:13px;outline:none}
.cats{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:10px 18px;border-radius:999px;background:#fff;border:1.5px solid var(--border);font-size:14px;font-weight:700;color:var(--ink);transition:.2s;cursor:pointer}
.chip small{opacity:.6;font-weight:500;margin-right:4px}
.chip:hover{border-color:var(--primary-2)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid-wrap{max-width:1200px;margin:0 auto;padding:6px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px;transition:.22s;position:relative}
.card:hover{box-shadow:var(--shadow);transform:translateY(-3px);border-color:#c9d8ef}
.pic{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--soft);cursor:pointer}
.pic svg,.pic img{width:100%;height:100%;object-fit:cover;display:block}
.badges{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.b{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.b-sale{background:var(--danger);color:#fff}
.b-rx{background:var(--accent);color:#2b1c00}
.b-warn{background:#fff;color:var(--danger);border:1px solid var(--danger-soft)}
.soldout{position:absolute;inset:0;background:rgba(255,255,255,.78);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--danger)}
.card .cat-tag{font-size:11px;color:var(--muted)}
.card h4{font-family:'Tajawal';font-size:15px;font-weight:700;min-height:44px;line-height:1.4}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
.price{font-size:17px;font-weight:700;color:var(--primary)}
.old{display:block;font-size:12px;color:var(--muted);font-weight:400}
.add-btn{background:var(--primary);color:#fff;width:38px;height:38px;border-radius:12px;font-size:22px;display:flex;align-items:center;justify-content:center;transition:.2s}
.add-btn:hover{background:var(--primary-2)}
.add-btn:disabled{background:var(--border);cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:9px;background:#fff;font-size:17px;font-weight:700;color:var(--primary)}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state .ic{font-size:44px;margin-bottom:10px}
.drawer-backdrop{position:fixed;inset:0;background:rgba(15,34,64,.45);z-index:60;opacity:0;pointer-events:none;transition:.25s}
.drawer-backdrop.show{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;left:0;height:100%;width:420px;max-width:94vw;background:#fff;z-index:70;transform:translateX(-105%);transition:.3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.15)}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drawer-body{flex:1;overflow-y:auto;padding:8px 20px}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center}
.cart-item .thumb{width:58px;height:58px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--soft)}
.cart-item .thumb svg,.cart-item .thumb img{width:100%;height:100%;object-fit:cover}
.cart-item .info{flex:1;min-width:0}
.cart-item .nm{font-weight:700;font-size:14px}
.drawer-foot{padding:16px 20px;border-top:1px solid var(--border);background:#fafbfe}
.free-bar{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;color:#7a5200}
.free-bar .track{height:6px;background:#fff;border-radius:6px;margin-top:6px;overflow:hidden}
.free-bar .fill{height:100%;background:var(--accent);border-radius:6px;transition:.3s}
.sum-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.total-row{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:10px 0 14px}
.btn-primary{background:var(--primary);color:#fff;padding:13px;border-radius:12px;width:100%;font-weight:800;font-size:15px;transition:.2s}
.btn-primary:hover{background:var(--primary-2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-accent{background:var(--accent);color:#2b1c00;padding:13px;border-radius:12px;width:100%;font-weight:800;font-size:15px}
.btn-accent:hover{background:var(--accent-dark)}
.btn-outline{background:#fff;border:1.5px solid var(--border);padding:12px;border-radius:12px;width:100%;font-weight:700}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,34,64,.5);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:22px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:26px;box-shadow:var(--shadow-lg);position:relative}
.modal h3{margin-bottom:16px;color:var(--primary)}
.close-x{position:absolute;top:16px;left:16px;width:34px;height:34px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:15px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--border);font-size:14px;outline:none;background:#fafbfe}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-2);background:#fff}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay-options{display:flex;gap:10px}
.pay-opt{flex:1;border:1.5px solid var(--border);border-radius:12px;padding:13px 8px;text-align:center;font-size:13px;font-weight:700;transition:.2s;cursor:pointer}
.pay-opt.active{border-color:var(--primary);background:var(--soft);color:var(--primary)}
.note-box{background:var(--info-soft);border-radius:12px;padding:14px;margin-bottom:14px}
.note-box .hint{font-size:12px;color:var(--muted);margin:6px 0 10px}
.track-card{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.steps{display:flex;gap:6px;margin-top:12px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--border)}
.steps i.on{background:var(--ok)}
.steps.bad i.on{background:var(--danger)}
.wa-float{position:fixed;bottom:20px;right:20px;z-index:45;background:#25D366;color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 22px rgba(37,211,102,.45)}
.site-footer{background:var(--primary);color:#fff;margin-top:20px;padding:34px 20px 26px;text-align:center}
.site-footer .row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.footer-whatsapp{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:#25D366;color:#fff;padding:10px 20px;border-radius:999px}
.footer-copy{font-size:12px;opacity:.65}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:120;transition:.3s;opacity:0;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}
.demo-banner{position:sticky;top:0;z-index:50;background:var(--accent);color:#2b1c00;text-align:center;padding:8px 14px;font-size:13px;font-weight:700}
.detail-pic{aspect-ratio:1/1;border-radius:16px;overflow:hidden;margin-bottom:14px;background:var(--soft)}
.detail-pic svg,.detail-pic img{width:100%;height:100%;object-fit:cover}
.admin-shell{display:flex;min-height:100vh}
.sidebar{width:236px;background:linear-gradient(180deg,#0E2A52,#14386B);color:#fff;display:flex;flex-direction:column;padding:22px 0;flex-shrink:0}
.sidebar .brand{color:#fff;padding:0 20px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.sidebar .brand .mark{background:rgba(255,255,255,.14);box-shadow:none}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 20px;font-size:14px;font-weight:700;color:rgba(255,255,255,.75);border-right:3px solid transparent;transition:.2s;cursor:pointer}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;border-right-color:var(--accent)}
.nav-item .ic{width:20px;text-align:center}
.nav-item .cnt{margin-right:auto;background:var(--accent);color:#2b1c00;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px}
.sidebar .logout{margin-top:auto;padding:13px 20px;color:rgba(255,255,255,.65);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.sidebar-copy{padding:6px 20px 4px;font-size:10.5px;color:rgba(255,255,255,.4)}
.admin-main{flex:1;padding:26px 30px;overflow-x:hidden;min-width:0}
.admin-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.admin-topline h2{font-size:24px;color:var(--primary)}
.who{font-size:13px;color:var(--muted)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-card .lbl{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
.stat-card .val{font-size:25px;font-weight:800;font-family:'Cairo'}
.stat-card.alert{border-color:#f4b9c3;background:var(--danger-soft)}
.stat-card.alert .val{color:var(--danger)}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.panel-head h3{font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;padding:10px 8px;color:var(--muted);font-weight:700;font-size:12px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.pill{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--accent-soft);color:#a86a00}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.pending{background:var(--info-soft);color:var(--primary-2)}
.mini-btn{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--ink);display:inline-block}
.mini-btn.primary{background:var(--primary);color:#fff}
.mini-btn.danger{background:var(--danger-soft);color:var(--danger)}
.mini-btn+.mini-btn{margin-right:6px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;background:#fafbfe;outline:none}
.fab{background:var(--accent);color:#2b1c00;padding:10px 18px;border-radius:11px;font-weight:800;font-size:13.5px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mini-table{min-width:480px}
.orders-table{min-width:860px}
.order-actions{display:flex;flex-wrap:wrap;gap:6px}
.rotate-hint{display:none}
.thumb-sm{width:42px;height:42px;border-radius:10px;overflow:hidden;background:var(--soft);display:inline-block;vertical-align:middle;margin-left:8px}
.thumb-sm svg,.thumb-sm img{width:100%;height:100%;object-fit:cover}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:44px;background:linear-gradient(180deg,var(--primary-2),var(--primary));border-radius:8px 8px 3px 3px;min-height:3px}
.bar b{font-family:'IBM Plex Sans Arabic';font-size:10.5px;color:var(--ink)}
.pos-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.pos-products{max-height:72vh;overflow-y:auto}
.pos-cart{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;height:fit-content;position:sticky;top:20px}
.pos-item{cursor:pointer}
.pos-item:hover{border-color:var(--primary-2)}
.img-prev{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--soft);margin-bottom:8px}
.img-prev img,.img-prev svg{width:100%;height:100%;object-fit:contain}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#0E2A52,#1F5FA8);padding:20px}
.login-card{background:#fff;border-radius:22px;padding:36px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);text-align:center}
.login-card .mark{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center}
.login-card .mark svg{width:28px;height:28px}
.admin-mobile-copy{display:none;text-align:center;font-size:10.5px;color:var(--muted);padding:14px 20px 20px}
@media(max-width:900px){
  .hero-card{grid-template-columns:1fr;padding:30px 24px}
  .hero-art{display:none}
  .hero h1{font-size:29px}
  .trust{grid-template-columns:1fr 1fr}
  .pos-grid{grid-template-columns:1fr}
  .admin-shell{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:8px}
  .sidebar .brand{display:none}
  .sidebar .logout{margin-top:0;white-space:nowrap}
  .nav-item{border-right:none;border-bottom:3px solid transparent;white-space:nowrap}
  .nav-item.active{border-bottom-color:var(--accent)}
  .sidebar-copy{display:none}
  .admin-mobile-copy{display:block}
  .admin-main{padding:18px 14px}
  .field-row{grid-template-columns:1fr}
}
@media(max-width:560px){
  .topbar-inner{gap:8px;padding:10px 12px;flex-wrap:wrap}
  .brand{font-size:17px}
  .search-wrap{order:3;flex-basis:100%;max-width:none}
  .admin-link{display:none}
  .hero,.trust,.section-head,.grid-wrap,.cats{padding-left:14px;padding-right:14px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card{padding:9px}
  .card h4{font-size:13.5px;min-height:38px}
  .stat-cards{grid-template-columns:1fr 1fr}
  .rotate-hint{display:block;background:var(--accent-soft);color:#a86a00;border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:700;margin-bottom:14px}
  .orders-table,.orders-table thead,.orders-table tbody,.orders-table th,.orders-table td,.orders-table tr{display:block;width:100%}
  .orders-table{min-width:0}
  .orders-table tr:first-child{display:none}
  .orders-table tr{margin-bottom:14px;border:1px solid var(--border);border-radius:12px;padding:6px 10px;background:#fff}
  .orders-table td{border:none;border-bottom:1px solid var(--border);padding:10px 6px 10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .orders-table td:last-child{border-bottom:none;flex-direction:column;align-items:stretch}
  .orders-table td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:12px;flex-shrink:0}
}

function getDeep(o,p){ return p.split('/').filter(Boolean).reduce((a,k)=> a==null?undefined:a[k], o); }
function setDeep(obj, path, val){
  const parts = path.split('/').filter(Boolean);
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ if(cur[parts[i]]==null) cur[parts[i]]={}; cur = cur[parts[i]]; }
  if(val===null) delete cur[parts[parts.length-1]]; else cur[parts[parts.length-1]] = val;
}

function reportDbError(err, ctx){
  console.error('db error', ctx, err && err.message);
  if(!dbErrorShown && STATE.admin){
    dbErrorShown = true;
    toast('تعذر الاتصال بقاعدة البيانات ('+ctx+') — تحقق من إعدادات الصلاحيات','err');
  }
}
function failover(err, ctx){
  USE_FIREBASE = false;
  if(STATE.products && Object.keys(STATE.products).length) LOCAL_DB.products = JSON.parse(JSON.stringify(STATE.products));
  reportDbError(err, ctx);
}
function dbListen(path, cb){
  const local = ()=>{ const fire = ()=> cb(JSON.parse(JSON.stringify(getDeep(LOCAL_DB,path)||{}))); localListeners.push(fire); fire(); };
  if(USE_FIREBASE){
    db.ref(path).on('value', s=>cb(s.val()||{}), err=>{ failover(err,'read '+path); local(); });
  } else local();
}
function dbSet(path,val){
  if(USE_FIREBASE) return db.ref(path).set(val).catch(err=>{ failover(err,'write '+path); setDeep(LOCAL_DB,path,val); refreshLocal(); });
  setDeep(LOCAL_DB,path,val); refreshLocal(); return Promise.resolve();
}
function dbUpdate(updates){
  if(USE_FIREBASE) return db.ref().update(updates).catch(err=>{ failover(err,'update'); Object.entries(updates).forEach(([p,v])=>setDeep(LOCAL_DB,p,v)); refreshLocal(); });
  Object.entries(updates).forEach(([p,v])=>setDeep(LOCAL_DB,p,v)); refreshLocal(); return Promise.resolve();
}
function dbRemove(path){
  if(USE_FIREBASE) return db.ref(path).remove().catch(err=>{ failover(err,'delete'); removeDeep(LOCAL_DB,path); refreshLocal(); });
  removeDeep(LOCAL_DB,path); refreshLocal(); return Promise.resolve();
}
function paymentsListen(path, cb){
  if(USE_FIREBASE_PAYMENTS) paymentsDb.ref(path).on('value', s=>cb(s.val()||{}), err=>{ reportDbError(err,'payments'); cb({}); });
  else cb(JSON.parse(JSON.stringify(getDeep(LOCAL_DB,path)||{})));
}
function paymentsSet(path,val){
  if(USE_FIREBASE_PAYMENTS) return paymentsDb.ref(path).set(val).catch(err=>{ reportDbError(err,'payments'); setDeep(LOCAL_DB,path,val); });
  setDeep(LOCAL_DB,path,val); return Promise.resolve();
}
function paymentsUpdate(updates){
  if(USE_FIREBASE_PAYMENTS) return paymentsDb.ref().update(updates).catch(err=>{ reportDbError(err,'payments'); });
  Object.entries(updates).forEach(([p,v])=>setDeep(LOCAL_DB,p,v)); return Promise.resolve();
}

function toast(msg,type=''){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show '+type;
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.className='toast',2800);
}
function fmtMoney(n){ return Number(n||0).toLocaleString('ar-EG')+' ج.م'; }
function daysUntil(d){
  if(!d) return 99999;
  const t = new Date(d); const n = new Date(); n.setHours(0,0,0,0);
  return Math.ceil((t-n)/86400000);
}
function isExpired(p){ return !!p.expiry && daysUntil(p.expiry) < 0; }
function isSellable(p){ return !isExpired(p); }
function toEgyptIntl(phone){
  phone = (phone||'').replace(/\D/g,'');
  if(phone.startsWith('20')) return phone;
  if(phone.startsWith('0')) return '2'+phone;
  return '20'+phone;
}
function validPhone(p){ return /^01[0125]\d{8}$/.test((p||'').replace(/\s|-/g,'')); }
async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function compressImage(file,max,q){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onerror = rej;
    r.onload = ()=>{
      const im = new Image();
      im.onerror = rej;
      im.onload = ()=>{
        const k = Math.min(1, max/Math.max(im.width,im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function catIcon(id){ const c = CATEGORIES.find(x=>x.id===id); return c?c.icon:'pill'; }
function hueOf(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%360; return h; }
function formOf(p){
  const n = p.name||'';
  if(p.category==='devices') return 'device';
  if(/حقن|انسولين/.test(n)) return 'syringe';
  if(/بخاخ/.test(n)) return 'inhaler';
  if(/شراب|نقط|حليب|بروتين|لوشن|غسول|شامبو|مطهر/.test(n)) return 'bottle';
  if(/كريم|جل|مرهم|صن بلوك|مرطب/.test(n)) return 'tube';
  if(/حفاض|فرشاة|كمادات/.test(n)) return 'box';
  return 'blister';
}
function drawnVisual(p){

  const S = {
    blister:`<rect x="22" y="30" width="76" height="60" rx="8" fill="#fff" stroke="${a}" stroke-width="3"/>`+[0,1,2].map(i=>[0,1].map(j=>`<ellipse cx="${40+i*20}" cy="${50+j*22}" rx="8" ry="6" fill="${a}" opacity=".85"/>`).join('')).join(''),
    bottle:`<rect x="46" y="14" width="28" height="14" rx="3" fill="${a}"/><rect x="38" y="28" width="44" height="78" rx="10" fill="#fff" stroke="${a}" stroke-width="3"/><rect x="38" y="52" width="44" height="30" fill="${a}" opacity=".9"/><path d="M52 67h16M60 59v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`,
    tube:`<path d="M34 22h52l-6 66H40z" fill="#fff" stroke="${a}" stroke-width="3"/><rect x="40" y="88" width="40" height="16" rx="3" fill="${a}"/><rect x="37" y="46" width="46" height="20" fill="${a}" opacity=".9"/>`,
    syringe:`<rect x="30" y="46" width="52" height="24" rx="5" fill="#fff" stroke="${a}" stroke-width="3"/><rect x="82" y="52" width="12" height="12" fill="${a}"/><path d="M94 58h18" stroke="${a}" stroke-width="3"/><rect x="18" y="38" width="6" height="40" rx="2" fill="${a}"/><rect x="24" y="56" width="10" height="4" fill="${a}"/><path d="M44 52v12M56 52v12M68 52v12" stroke="${a}" stroke-width="2"/>`,
    device:`<rect x="28" y="20" width="64" height="80" rx="12" fill="#fff" stroke="${a}" stroke-width="3"/><rect x="38" y="32" width="44" height="26" rx="4" fill="${a}"/><circle cx="60" cy="80" r="10" fill="${a}" opacity=".85"/>`,
    inhaler:`<rect x="44" y="18" width="32" height="52" rx="6" fill="#fff" stroke="${a}" stroke-width="3"/><path d="M44 70h32v18a8 8 0 0 1-8 8H52a8 8 0 0 1-8-8z" fill="${a}"/><rect x="52" y="30" width="16" height="22" rx="3" fill="${a}" opacity=".35"/>`,
    box:`<rect x="26" y="34" width="68" height="56" rx="6" fill="#fff" stroke="${a}" stroke-width="3"/><path d="M60 48v28M46 62h28" stroke="${a}" stroke-width="7" stroke-linecap="round"/>`
  };
  return `<svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="${bgc}"/><circle cx="100" cy="18" r="30" fill="#fff" opacity=".35"/>${S[formOf(p)]}</svg>`;
}
function productVisual(p){
  const drawn = drawnVisual(p);
  let src = '';
  if(p.image && /^(data:image\/|https:\/\/|images\/)/.test(p.image)) src = p.image;
  else if(IMAGES_FOLDER && p.id) src = IMAGES_FOLDER+p.id+'.jpg';
  if(!src) return drawn;
  return `<span class="vis">${drawn}<img src="${esc(src)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()"></span>`;
}

function addToCart(id){
  const p = STATE.products[id];
  if(!p || !isSellable(p)){ toast('المنتج ده مش متاح حالياً','err'); return; }
  if((p.stock||0) <= (STATE.cart[id]||0)){ toast('الكمية المتاحة خلصت','err'); return; }
  STATE.cart[id] = (STATE.cart[id]||0)+1;
  saveCart(); toast('اتضاف للسلة','ok'); refreshStoreData();
}
function changeQty(id,delta){
  const p = STATE.products[id];
  const q = (STATE.cart[id]||0)+delta;
  if(q<=0) delete STATE.cart[id];
  else if(p && q>(p.stock||0)){ toast('مفيش كمية كفاية','err'); return; }
  else STATE.cart[id] = q;
  saveCart(); refreshStoreData();
}
function renderCart(){
  const body = document.getElementById('cartBody'), foot = document.getElementById('cartFoot');
  if(!body) return;
  Object.keys(STATE.cart).forEach(id=>{ if(STATE.products[id] && !isSellable(STATE.products[id])) delete STATE.cart[id]; });
  const items = Object.entries(STATE.cart).filter(([id])=>STATE.products[id]);
  body.innerHTML = items.length ? items.map(([id,q])=>{
    const p = {id,...STATE.products[id]};

function submitOrder(){
  const name = document.getElementById('ckName').value.trim();
  const phone = document.getElementById('ckPhone').value.trim();
  const addr = document.getElementById('ckAddr').value.trim();
  if(!name || !phone || !addr){ toast('من فضلك اكمل بيانات الطلب','err'); return; }
  if(!validPhone(phone)){ toast('رقم الموبايل غير صحيح','err'); return; }
  if(needsRx() && !checkout.rxImage){ toast('لازم ترفع صورة الروشتة','err'); return; }
  if(checkout.pay==='instapay' && !checkout.instapayClicked){ toast('اضغط "افتح صفحة الدفع" وأتمم الدفع الأول','err'); return; }
  if(checkout.pay==='instapay' && !checkout.receiptImage){ toast('لازم ترفع صورة إيصال الدفع','err'); return; }
  const items = Object.entries(STATE.cart).filter(([id])=>STATE.products[id]).map(([id,qty])=>({ id, name:STATE.products[id].name, price:STATE.products[id].price, qty }));
  if(!items.length) return;
  const subtotal = cartSubtotal(), fee = cartDelivery(), total = subtotal+fee;
  const orderId = uid();
  const win = window.open('','_blank');
  const updates = {};
  updates['orders/'+orderId] = { customerName:name, phone, address:addr, items, subtotal, deliveryFee:fee, total, paymentMethod:checkout.pay, status:'pending', createdAt:Date.now() };
  if(checkout.rxImage) updates['prescriptions/'+orderId] = { image:checkout.rxImage, customerName:name, createdAt:Date.now() };
  const paySave = checkout.receiptImage ? paymentsSet('payments/'+orderId, { orderId, customerName:name, phone, amount:total, receiptImage:checkout.receiptImage, createdAt:Date.now() }) : Promise.resolve();
  const payLabel = checkout.pay==='cash' ? 'كاش عند الاستلام' : 'إنستاباي (تم الدفع)';
  const msg = `طلب جديد من ${PHARMACY_NAME}\nالاسم: ${name}\nالتليفون: ${phone}\nالعنوان: ${addr}\n\nالمنتجات:\n${items.map(i=>`- ${i.name} × ${i.qty} = ${fmtMoney(i.price*i.qty)}`).join('\n')}\n\nالتوصيل: ${fee?fmtMoney(fee):'مجاني'}\nالإجمالي: ${fmtMoney(total)}\nطريقة الدفع: ${payLabel}${checkout.receiptImage?'\nصورة إيصال الدفع مرفوعة على لوحة التحكم':''}\nرقم الطلب: ${orderId}`;
  Promise.all([dbUpdate(updates), paySave]).then(()=>{
    const url = `https://wa.me/${toEgyptIntl(PHARMACY_PHONE)}?text=${encodeURIComponent(msg)}`;
    if(win) win.location.href = url; else location.href = url;
    const mine = lsGet('myOrders',[]); mine.unshift(orderId); lsSet('myOrders', mine.slice(0,15));
    lsSet('customer',{Name:name,Phone:phone,Addr:addr});
    watchOrder(orderId);
    STATE.cart = {}; saveCart();
    checkout = { pay:'cash', rxImage:null, receiptImage:null, instapayClicked:false };
    setPay('cash'); document.getElementById('rxState').textContent=''; document.getElementById('receiptState').textContent='';
    closeCheckout(); toast('تم إرسال طلبك بنجاح','ok'); refreshStoreData();
  }).catch(()=>{ if(win) win.close(); toast('حصل خطأ، حاول تاني','err'); });
}

function estimateStorageMB(){
  let bytes = 0;
  Object.values(STATE.prescriptions||{}).forEach(rx=>{ if(rx && rx.image) bytes += rx.image.length*.75; });
  bytes += JSON.stringify(STATE.orders||{}).length + JSON.stringify(STATE.products||{}).length;
  return bytes/(1024*1024);
}
function cleanupOldReceiptData(silent){
  const cutoff = Date.now()-OLD_ORDER_DAYS_FOR_CLEANUP*86400000;
  const updates = {}; let freed = 0;
  Object.entries(STATE.orders||{}).forEach(([id,o])=>{
    if((o.status==='completed'||o.status==='cancelled') && o.createdAt<cutoff && STATE.prescriptions[id] && STATE.prescriptions[id].image){
      updates['prescriptions/'+id+'/image'] = null; freed++;
    }
  });
  if(!freed){ if(!silent) toast('مفيش صور روشتات قديمة للتنظيف','ok'); return; }
  dbUpdate(updates).then(()=>{ toast(`اتنضفت ${freed} صورة روشتة قديمة`,'ok'); });
}
function autoCleanupIfNeeded(){ if(estimateStorageMB()>=STORAGE_AUTOCLEAN_MB) cleanupOldReceiptData(true); }
function storageLevel(){ const u = estimateStorageMB(); return u>=STORAGE_AUTOCLEAN_MB?'danger':u>=STORAGE_WARNING_MB?'warn':'ok'; }
function storageStatusHtml(){
  const used = estimateStorageMB(), pct = Math.min(100,used/STORAGE_FREE_LIMIT_MB*100), lvl = storageLevel();
  const color = lvl==='danger'?'#D9435A':lvl==='warn'?'#F2A93B':'#1FA37A';
  const note = lvl==='danger'?'المساحة قربت تخلص — التنظيف التلقائي هيمسح صور الروشتات القديمة.':lvl==='warn'?'المساحة بدأت تقرب من الحد المجاني.':'المساحة المستخدمة لسه بعيدة عن الحد المجاني.';
  return `<div class="panel"><div class="panel-head"><h3>${ic('database',18)} مساحة التخزين</h3><button class="mini-btn primary" onclick="cleanupOldReceiptData(false)">${ic('eraser',15)} نظّف دلوقتي</button></div>
    <div style="background:#eef1f7;border-radius:8px;overflow:hidden;height:10px;margin:8px 0"><div style="width:${pct}%;background:${color};height:100%"></div></div>
    <div style="font-size:13px;color:var(--muted)">مستخدم تقريباً <span class="num">${used.toFixed(1)}</span> ميجا من <span class="num">${STORAGE_FREE_LIMIT_MB}</span>. ${note}</div></div>`;
}
function purgeOldOrders(days){

  Object.entries(STATE.orders||{}).forEach(([id,o])=>{
    if((o.status==='completed'||o.status==='cancelled') && o.createdAt<cutoff){ updates['orders/'+id]=null; if(STATE.prescriptions[id]) updates['prescriptions/'+id]=null; n++; }
  });
  if(!n){ toast('مفيش طلبات قديمة بالمواصفات دي','ok'); return; }
  dbUpdate(updates).then(()=>toast(`تم حذف ${n} طلب`,'ok'));

function viewOverview(){
  const pa = Object.entries(STATE.products||{}).map(([id,p])=>({id,...p}));
  const oa = Object.entries(STATE.orders||{}).map(([id,o])=>({id,...o}));
  const today = new Date(); today.setHours(0,0,0,0);
  const done = oa.filter(o=>o.status==='completed');
  const revToday = done.filter(o=>o.createdAt>=today.getTime()).reduce((s,o)=>s+o.total,0);
  const revAll = done.reduce((s,o)=>s+o.total,0);
  const low = pa.filter(p=>!isExpired(p) && (p.stock||0)<=LOW_STOCK_THRESHOLD);
  const expired = pa.filter(isExpired);
  const soon = pa.filter(p=>{ const d = daysUntil(p.expiry); return d>=0 && d<=EXPIRY_WARNING_DAYS; });
  const pending = oa.filter(o=>o.status==='pending');
  const days = [];
  for(let i=6;i>=0;i--){ const d = new Date(today); d.setDate(d.getDate()-i); days.push(d); }
  const sums = days.map(d=>{ const a = d.getTime(), b = a+86400000; return done.filter(o=>o.createdAt>=a && o.createdAt<b).reduce((s,o)=>s+o.total,0); });
  const mx = Math.max(1,...sums);
  const alerts = [...expired.map(p=>({p,t:'expired'})), ...low.map(p=>({p,t:'low'})), ...soon.map(p=>({p,t:'soon'}))].slice(0,10);
  return `
    <div class="admin-topline"><h2>نظرة عامة</h2><span class="who">${esc(STATE.admin.name)}</span></div>

function normName(s){
  return String(s).toLowerCase().replace(/\.[a-z0-9]+$/i,'').replace(/[\s_\-.+()]/g,'').replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
}
async function bulkUploadImages(e){
  const files = Array.from(e.target.files||[]); if(!files.length) return;
  const prods = Object.entries(STATE.products||{}).map(([id,p])=>({id,key:normName(p.name)}));
  const updates = {}; let ok = 0; const miss = [];
  toast('جاري معالجة '+files.length+' صورة...');
  for(const f of files){
    const base = f.name.replace(/\.[^.]+$/,''), k = normName(base);
    let m = prods.find(p=>p.id===base) || prods.find(p=>p.key===k);
    if(!m && k.length>=3){ const c = prods.filter(p=>p.key.includes(k)||k.includes(p.key)); if(c.length===1) m = c[0]; }
    if(!m){ miss.push(f.name); continue; }
    try{ updates['products/'+m.id+'/image'] = await compressImage(f,520,.8); ok++; }catch(err){ miss.push(f.name); }
  }
  e.target.value = '';
  if(ok) await dbUpdate(updates);
  toast(`تم ربط ${ok} صورة`+(miss.length?` — لم تُطابق: ${miss.slice(0,4).join('، ')}${miss.length>4?'…':''}`:''), miss.length?'err':'ok');
}

function filterInventory(){
  const s = document.getElementById('invSearch').value, c = document.getElementById('invCat').value, st = document.getElementById('invStatus').value;

function saveProduct(){
  const id = document.getElementById('pId').value || uid();

  if(!name){ toast('اكتب اسم المنتج','err'); return; }
  const price = Number(document.getElementById('pPrice').value)||0;
  const old = Number(document.getElementById('pOldPrice').value)||0;
  const data = {
    name, category:document.getElementById('pCat').value, price,
    stock:Number(document.getElementById('pStock').value)||0,
    expiry:document.getElementById('pExpiry').value, rx:document.getElementById('pRx').checked
  };
  if(old>price) data.oldPrice = old;

  dbSet('products/'+id, data).then(()=>{ toast('تم الحفظ','ok'); closeProductModal(); renderAdmin(); });

  const p = STATE.products[id];
  if((posCart[id]||0)>=p.stock){ toast('الكمية المتاحة خلصت','err'); return; }
  posCart[id] = (posCart[id]||0)+1; updatePosCart();

function posChangeQty(id,delta){
  const q = (posCart[id]||0)+delta, p = STATE.products[id];
  if(q<=0) delete posCart[id]; else if(p && q>p.stock){ toast('الكمية المتاحة خلصت','err'); return; } else posCart[id] = q;
  updatePosCart();

function completePosSale(){
  const items = Object.entries(posCart).filter(([id])=>STATE.products[id]);
  if(!items.length){ toast('الفاتورة فاضية','err'); return; }
  const list = items.map(([id,q])=>({ id, name:STATE.products[id].name, price:STATE.products[id].price, qty:q }));
  const total = list.reduce((s,i)=>s+i.price*i.qty,0), orderId = uid(), updates = {};
  updates['orders/'+orderId] = { customerName:'عميل كاشير', phone:'-', address:'-', items:list, total, paymentMethod:posPayMethod, status:'completed', createdAt:Date.now(), source:'pos' };
  list.forEach(i=>{ updates['products/'+i.id+'/stock'] = Math.max(0,(STATE.products[i.id].stock||0)-i.qty); });
  const method = posPayMethod, doPrint = posPrint;
  dbUpdate(updates).then(()=>{

    posCart = {}; posPayMethod = 'cash'; toast('تم البيع بنجاح','ok'); renderAdmin();
  });
}

        <td data-label="الحالة">${statusPill(o.status)}</td>
        <td data-label="الوقت" class="num">${new Date(o.createdAt).toLocaleString('ar-EG')}</td>
        <td data-label="الإجراءات"><div class="order-actions">${orderActionsHtml(o)}</div></td></tr>`).join('') || '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:30px">لا يوجد طلبات في هذا التصنيف</td></tr>'}
    </table></div></div>`;
}
function updateOrderStatus(id,status){
  const order = STATE.orders[id]; if(!order) return;
  const updates = {}; updates['orders/'+id+'/status'] = status;
  if(status==='completed' && !order.stockDeducted && order.source!=='pos'){
    (order.items||[]).forEach(it=>{ const p = STATE.products[it.id]; if(p) updates['products/'+it.id+'/stock'] = Math.max(0,(p.stock||0)-it.qty); });
    updates['orders/'+id+'/stockDeducted'] = true;
  }
  let msg = null;
  if(status==='preparing') msg = `تم قبول طلبك في ${PHARMACY_NAME}\nرقم الطلب: ${id}\nجاري تجهيزه الآن.`;
  else if(status==='completed') msg = `تم تسليم طلبك من ${PHARMACY_NAME}\nرقم الطلب: ${id}\nالإجمالي: ${fmtMoney(order.total)}\nشكراً لثقتك!`;
  else if(status==='cancelled') msg = `نعتذر، تم رفض/إلغاء طلبك في ${PHARMACY_NAME}.\nرقم الطلب: ${id}\nللاستفسار تواصل معنا على واتساب: ${SUPPORT_WHATSAPP}`;
  if(msg && order.phone && order.phone!=='-') window.open(`https://wa.me/${toEgyptIntl(order.phone)}?text=${encodeURIComponent(msg)}`,'_blank');
  dbUpdate(updates).then(()=>{ toast('تم تحديث حالة الطلب','ok'); renderAdmin(); });
}
function lockOrdersLandscape(){
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  const tryLock = ()=>{
    if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>toast('دوّر الموبايل يدوي للوضع الأفقي ','ok'));
    else toast('دوّر الموبايل يدوي للوضع الأفقي ','ok');
  };
  if(req) req.call(el).then(tryLock).catch(()=>toast('دوّر الموبايل يدوي للوضع الأفقي ','err'));
  else toast('دوّر الموبايل يدوي للوضع الأفقي ','err');
}

function viewPrescriptions(){
  const rx = Object.entries(STATE.prescriptions||{}).filter(([id,r])=>r&&r.image);
  return `<div class="admin-topline"><h2>مراجعة الروشتات الطبية</h2></div><div class="panel"><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
    ${rx.length?rx.map(([id,r])=>`<div class="card"><img src="${r.image}" style="width:100%;border-radius:12px;height:160px;object-fit:cover;cursor:pointer" onclick="viewImage('prescriptions','${id}')"><h4 style="min-height:0">${esc(r.customerName)}</h4>
      <div style="font-size:12px;color:var(--muted)" class="num">${new Date(r.createdAt).toLocaleString('ar-EG')}</div><div style="font-size:11px;color:var(--muted)">الطلب: ${esc(id)}</div></div>`).join(''):'<div class="empty-state" style="grid-column:1/-1">لا توجد روشتات مرفوعة بعد</div>'}
  </div></div>`;
}

function viewReports(){
  const oa = Object.entries(STATE.orders||{}).map(([id,o])=>({id,...o})).filter(o=>o.status==='completed');
  const sales = {};
  oa.forEach(o=>(o.items||[]).forEach(it=>{ sales[it.name] = (sales[it.name]||0)+it.qty; }));
  const top = Object.entries(sales).sort((a,b)=>b[1]-a[1]).slice(0,8), mx = top.length?top[0][1]:1;
  const rev = oa.reduce((s,o)=>s+o.total,0), avg = oa.length?rev/oa.length:0;
  const cash = oa.filter(o=>o.paymentMethod==='cash').reduce((s,o)=>s+o.total,0), insta = oa.filter(o=>o.paymentMethod==='instapay').reduce((s,o)=>s+o.total,0);
  return `<div class="admin-topline"><h2>التقارير</h2><button class="fab" onclick="exportCSV()">${ic('download',15)} تصدير CSV</button></div>
    <div class="stat-cards">
      <div class="stat-card"><div class="lbl">إجمالي الإيرادات</div><div class="val num">${fmtMoney(rev)}</div></div>
      <div class="stat-card"><div class="lbl">الطلبات المكتملة</div><div class="val num">${oa.length}</div></div>
      <div class="stat-card"><div class="lbl">متوسط قيمة الطلب</div><div class="val num">${fmtMoney(Math.round(avg))}</div></div>
      <div class="stat-card"><div class="lbl">كاش</div><div class="val num">${fmtMoney(cash)}</div></div>
      <div class="stat-card"><div class="lbl">إنستاباي</div><div class="val num">${fmtMoney(insta)}</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>الأصناف الأكثر مبيعاً</h3></div>
      ${top.length?top.map(([n,q])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${esc(n)}</span><span class="num">${q} وحدة</span></div><div style="background:var(--soft);border-radius:8px;height:9px;overflow:hidden"><div style="width:${q/mx*100}%;background:linear-gradient(90deg,var(--primary-2),var(--primary));height:100%"></div></div></div>`).join(''):'<div class="empty-state">لا توجد بيانات مبيعات بعد</div>'}
    </div>`;
}
function exportCSV(){
  const q = v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  let csv = ['رقم الطلب','العميل','التليفون','الإجمالي','الدفع','الحالة','التاريخ'].map(q).join(',')+'\n';
  Object.entries(STATE.orders||{}).forEach(([id,o])=>{
    csv += [id,o.customerName,o.phone,o.total,o.paymentMethod,o.status,new Date(o.createdAt).toLocaleString('ar-EG')].map(q).join(',')+'\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8;'}));
  a.download = 'orders_report.csv'; a.click();
}

watchMyOrders();
render();
</script>
