<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Nexa Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 15s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(1.1); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .nexa-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 0.75rem;
            user-select: none;
        }

        .nexa-logo span {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .nexa-logo:hover span { transform: translateY(-4px); }
        .nexa-logo:hover span:nth-child(1) { transition-delay: 0s; }
        .nexa-logo:hover span:nth-child(2) { transition-delay: 0.05s; }
        .nexa-logo:hover span:nth-child(3) { transition-delay: 0.1s; }
        .nexa-logo:hover span:nth-child(4) { transition-delay: 0.15s; }
        .nexa-logo:hover span:nth-child(5) { transition-delay: 0.2s; }

        .nexa-logo .n { color: #3b82f6; text-shadow: 0 0 30px rgba(59, 130, 246, 0.5); }
        .nexa-logo .e { color: #8b5cf6; text-shadow: 0 0 30px rgba(139, 92, 246, 0.5); }
        .nexa-logo .x { color: #ec4899; text-shadow: 0 0 30px rgba(236, 72, 153, 0.5); }
        .nexa-logo .a { color: #f59e0b; text-shadow: 0 0 30px rgba(245, 158, 11, 0.5); }
        .nexa-logo .dot { color: #10b981; text-shadow: 0 0 30px rgba(16, 185, 129, 0.5); margin-left: 2px; }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 2.8rem 0.85rem 1rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.08);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group.success input {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .form-group.success label { color: #10b981; }

        .form-group.error input {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.08);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .form-group.error label { color: #ef4444; }

        .status-icon {
            position: absolute;
            right: 0.9rem;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .form-group.success .status-icon,
        .form-group.error .status-icon {
            transform: translateY(-50%) scale(1);
        }

        .status-icon svg {
            width: 20px;
            height: 20px;
            stroke-width: 2.5;
            fill: none;
        }

        .status-icon.success svg { stroke: #10b981; }
        .status-icon.error svg { stroke: #ef4444; }

        .form-group.success .status-icon.error,
        .form-group.error .status-icon.success {
            display: none;
        }

        .error-message {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0;
            padding: 0 0.75rem;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(220, 38, 38, 0.1) 100%);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.4;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group.error .error-message {
            opacity: 1;
            max-height: 60px;
            padding: 0.5rem 0.75rem;
            margin-top: 0.4rem;
        }

        .error-message svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            stroke: #ef4444;
            stroke-width: 2.5;
            fill: none;
        }

        .success-message {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0;
            padding: 0 0.75rem;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.1) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            color: #6ee7b7;
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group.success .success-message {
            opacity: 1;
            max-height: 60px;
            padding: 0.5rem 0.75rem;
            margin-top: 0.4rem;
        }

        .success-message svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            stroke: #10b981;
            stroke-width: 2.5;
            fill: none;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.75rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-login:hover::before { left: 100%; }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.5);
        }

        .btn-login:active:not(:disabled) { transform: translateY(0); }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.8rem;
        }

        .footer-text a {
            color: rgba(148, 163, 184, 0.9);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-text a:hover { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <div class="nexa-logo">
                <span class="n">N</span>
                <span class="e">e</span>
                <span class="x">x</span>
                <span class="a">a</span>
                <span class="dot">.</span>
            </div>
            <p>ADMIN CONTROL PANEL</p>
        </div>

        <div id="loginForm">
            <!-- Email -->
            <div class="form-group" id="emailGroup">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="admin@nexa.com" autocomplete="email">
                    <span class="status-icon success">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    <span class="status-icon error">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12" stroke-linecap="round"/><line x1="12" y1="16" x2="12.01" y2="16" stroke-linecap="round"/></svg>
                    </span>
                </div>
                <div class="error-message">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12" stroke-linecap="round"/><line x1="12" y1="16" x2="12.01" y2="16" stroke-linecap="round"/></svg>
                    <span id="emailErrorText"></span>
                </div>
                <div class="success-message">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Email looks good</span>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group" id="passwordGroup">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
                    <span class="status-icon success">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    <span class="status-icon error">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12" stroke-linecap="round"/><line x1="12" y1="16" x2="12.01" y2="16" stroke-linecap="round"/></svg>
                    </span>
                </div>
                <div class="error-message">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12" stroke-linecap="round"/><line x1="12" y1="16" x2="12.01" y2="16" stroke-linecap="round"/></svg>
                    <span id="passwordErrorText"></span>
                </div>
                <div class="success-message">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Password looks good</span>
                </div>
            </div>

            <button type="button" class="btn-login" id="submitBtn">Sign In</button>
        </div>

        <p class="footer-text">Developed by <a href="#">Mohamed Yousry</a></p>
    </div>

    <script>
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailGroup = document.getElementById('emailGroup');
        const passwordGroup = document.getElementById('passwordGroup');
        const emailErrorText = document.getElementById('emailErrorText');
        const passwordErrorText = document.getElementById('passwordErrorText');
        const submitBtn = document.getElementById('submitBtn');

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function validateEmail() {
            const value = emailInput.value.trim();
            if (value === '') {
                showError(emailGroup, emailErrorText, 'Email address is required');
                return false;
            }
            if (!emailRegex.test(value)) {
                showError(emailGroup, emailErrorText, 'Please enter a valid email address');
                return false;
            }
            showSuccess(emailGroup);
            return true;
        }

        function validatePassword() {
            const value = passwordInput.value;
            if (value === '') {
                showError(passwordGroup, passwordErrorText, 'Password is required');
                return false;
            }
            if (value.length < 6) {
                showError(passwordGroup, passwordErrorText, 'Password must be at least 6 characters');
                return false;
            }
            showSuccess(passwordGroup);
            return true;
        }

        function showError(group, textEl, message) {
            group.classList.remove('success');
            group.classList.add('error');
            textEl.textContent = message;
        }

        function showSuccess(group) {
            group.classList.remove('error');
            group.classList.add('success');
        }

        emailInput.addEventListener('blur', validateEmail);
        emailInput.addEventListener('input', () => {
            if (emailGroup.classList.contains('error')) validateEmail();
        });

        passwordInput.addEventListener('blur', validatePassword);
        passwordInput.addEventListener('input', () => {
            if (passwordGroup.classList.contains('error')) validatePassword();
        });

        // ✅ الزر — onclick (مش submit)
        submitBtn.addEventListener('click', () => {
            const isEmailValid = validateEmail();
            const isPasswordValid = validatePassword();

            if (!isEmailValid || !isPasswordValid) {
                return;
            }

            // Loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Signing in...';

            setTimeout(() => {
                window.location.href = 'dashboard.html';  // ← غيّر اسم الصفحة هنا
            }, 1200);
        });
    </script>
</body>
</html>
